<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة فجوة | استخراج الفجوات الإعلامية وصياغة الأخبار</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --text-main: #c9d1d9;
            --text-bright: #ffffff;
            --primary: #58a6ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.7;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--text-bright);
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        header p {
            color: #8b949e;
            font-size: 1.05rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--text-bright);
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 14px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-bright);
            font-size: 1rem;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #21262d;
            color: #8b949e;
            cursor: not-allowed;
        }

        .results-card {
            display: none;
        }

        .results-content {
            color: var(--text-main);
            font-size: 1.05rem;
            line-height: 1.8;
        }

        .results-content h1, .results-content h2, .results-content h3 {
            color: var(--text-bright);
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .results-content strong {
            color: var(--primary);
        }

        .loading {
            text-align: center;
            display: none;
            padding: 20px;
            color: #8b949e;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>منصة فجوة 🗞️</h1>
        <p>استخراج الفجوات الإعلامية وصياغة أخبار صحفية منفردة وجاهزة للنشر</p>
    </header>

    <div class="card">
        <div class="form-group">
            <label for="apiKey">مفتاح Gemini API Key:</label>
            <input type="password" id="apiKey" placeholder="أدخل مفتاح الـ API الخاص بك..." />
        </div>

        <div class="form-group">
            <label for="newsInput">نص الخبر المراد تحليله واستخراج الانفراد منه:</label>
            <textarea id="newsInput" rows="6" placeholder="ضع نص الخبر هنا..."></textarea>
        </div>

        <button id="submitBtn" onclick="analyzeNews()">استخراج الفجوة وصياغة الخبر الجديد</button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>جاري تحليل الخبر واكتشاف الفجوات وصياغة التقرير الجديد...</p>
    </div>

    <div class="card results-card" id="resultsCard">
        <h2 style="color: var(--text-bright); margin-bottom: 15px;">النتيجة والخبر الجديد الجاهز للنشر:</h2>
        <div class="results-content" id="resultContent"></div>
    </div>
</div>

<script>
    // استرجاع مفتاح الـ API المحفوظ إن وجد
    document.addEventListener("DOMContentLoaded", () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }
    });

    async function analyzeNews() {
        const apiKeyInput = document.getElementById('apiKey').value.trim();
        const newsInput = document.getElementById('newsInput').value.trim();
        const resultDiv = document.getElementById('resultContent');
        const resultsCard = document.getElementById('resultsCard');
        const loadingDiv = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');

        if (!newsInput) {
            alert('يرجى إدخال نص الخبر أولاً');
            return;
        }

        const apiKey = apiKeyInput || localStorage.getItem('gemini_api_key') || '';
        if (!apiKey) {
            alert('يرجى إدخال مفتاح API الخاص بـ Gemini');
            return;
        }

        // حفظ المفتاح محلياً للتسهيل
        localStorage.setItem('gemini_api_key', apiKey);

        submitBtn.disabled = true;
        loadingDiv.style.display = 'block';
        resultsCard.style.display = 'none';

        const mediaPrompt = `أنت صحفي ومحرر إعلامي محترف. وظيفتك الوحيدة هي: البحث عن الزاوية المفقودة (الفجوة الإعلامية) في الخبر المرفق، وصياغة "خبر صحفي جديد بالكامل" يغطي تلك الزاوية، ليصبح جاهزاً للنشر فوراً.

⚠️ تنبيه صارم: يمنع منعاً باتاً شرح معاني الكلمات، أو القيام بتحليل لغوي، أو تفكيك بلاغي للنص.

قم بتنسيق المخرجات مباشرة بالشكل التالي:

1️⃣ **الفجوة الإعلامية المكتشفة:**
(سطران يوضحان الجانب الذي أغفلت وسائل الإعلام الأخرى تغطيته في هذا الخبر).

2️⃣ **عنوان الخبر الجديد (جاهز للنشر):**
(عنوان صحفي جذاب ومباشر يركز على الزاوية المفقودة).

3️⃣ **نص الخبر الصحفي الجديد (جاهز للنشر فوراً):**
(اكتب خبراً صحفياً كاملاً ومكتمل الأركان: مقدمة إخبارية، تفاصيل وأبعاد التغطية المنفردة، وخاتمة. صغ النص بأسلوب إعلامي رصين جاهز للنسخ والنشر مباشرة).

النص المراد تحليله واستخراج الخبر منه:
` + newsInput;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: mediaPrompt }]
                    }]
                })
            });

            const data = await response.json();

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const text = data.candidates[0].content.parts[0].text;
                resultDiv.innerHTML = typeof marked !== 'undefined' ? marked.parse(text) : text.replace(/\n/g, '<br>');
                resultsCard.style.display = 'block';
            } else {
                alert('حدث خطأ أثناء معالجة الطلب، يرجى التأكد من صحة مفتاح الـ API.');
            }
        } catch (error) {
            console.error(error);
            alert('تعذر الاتصال بالخدمة. يرجى مراجعة الاتصال بالإنترنت ومفتاح API.');
        } finally {
            submitBtn.disabled = false;
            loadingDiv.style.display = 'none';
        }
    }
</script>

</body>
</html>
