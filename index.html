<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة فجوة | Fajwah AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { max-width: 750px; width: 100%; margin-top: 30px; }
    .header { text-align: center; margin-bottom: 30px; }
    h1 { color: #38bdf8; font-size: 32px; margin-bottom: 8px; }
    p.subtitle { color: #94a3b8; font-size: 16px; margin: 0; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
    label { display: block; font-weight: 600; margin-bottom: 10px; color: #e2e8f0; }
    textarea { width: 100%; height: 160px; background: #0f172a; border: 1px solid #475569; border-radius: 12px; color: #fff; padding: 16px; font-size: 16px; resize: vertical; outline: none; transition: 0.2s; }
    textarea:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
    button { width: 100%; background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; margin-top: 16px; transition: 0.2s; }
    button:hover { opacity: 0.95; transform: translateY(-1px); }
    button:disabled { background: #475569; cursor: not-allowed; transform: none; }
    .result-title { font-weight: 700; margin-top: 24px; color: #38bdf8; display: block; }
    .result-box { margin-top: 10px; background: #0f172a; border-radius: 12px; padding: 20px; border: 1px solid #334155; min-height: 120px; white-space: pre-wrap; line-height: 1.8; color: #cbd5e1; font-size: 15px; }
    .loading { text-align: center; color: #38bdf8; font-weight: 600; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>منصة فجوة (Fajwah AI)</h1>
      <p class="subtitle">استكشاف الفجوات الإعلامية والانفراد بالمحتوى الرقمي</p>
    </div>
    
    <div class="card">
      <label for="userInput">أدخل الخبر أو المحتوى الإعلامي لاستخراج الفجوات:</label>
      <textarea id="userInput" placeholder="ألصق نص الخبر أو التصريح الإعلامي هنا..."></textarea>
      <button id="sendBtn" onclick="analyzeContent()">استخراج الفجوة الإعلامية</button>
      
      <span class="result-title">تقرير الفجوة والزوايا المفقودة:</span>
      <div id="output" class="result-box">في انتظار إدخال الخبر لبدء استخراج الفجوات...</div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://fajwah-ai.azm24495.workers.dev";

    async function analyzeContent() {
      const input = document.getElementById("userInput").value.trim();
      const output = document.getElementById("output");
      const btn = document.getElementById("sendBtn");

      if (!input) {
        alert("الرجاء إدخال نص الخبر أولاً!");
        return;
      }

      output.innerHTML = '<div class="loading">جاري التفتيش عن الفجوات الإعلامية والزوايا المفقودة... ⏳</div>';
      btn.disabled = true;

      const mediaPrompt = `أنت خبير ومحلل إعلامي متخصص في رصد "الفجوات الإعلامية". 
مهمتك ليست إعادة شرح النص أو تحليل بلاغته، بل استخراج ما أغفلته وسائل الإعلام وتزويد الباحث/صانع المحتوى بزوايا انفراد جاهزة للنشر.

قم بتحليل النص التالي واستخرج ما يلي مباشرة:

1. 🎯 **الفجوة الإعلامية (ما الذي أغفلته وسائل الإعلام؟):**
- الزوايا الغائبة (سياقية، تاريخية، أبعاد سياسية أو اقتصادية أو اجتماعية لم تطرح).
- النقاط التفصيلية التي تتجاهل التغطيات السائدة التركيز عليها.

2. ❓ **الأسئلة المعلقة:**
- الأسئلة الجوهرية التي يطرحها المتابع بعد قراءة الخبر ولم تجب عنها التغطية.

3. 💡 **زوايا معالجة مقترحة للانفراد (Content Angles):**
- 3 زوايا صحفية أو أفكار صانع محتوى متميزة تغطي هذه الفجوة وتصنع فارقاً عند نشرها.

4. ✍️ **عناوين مقترحة للنشر:**
- 3 عناوين جذابة وقوية تبدأ من الفجوة الإعلامية مباشرة لتغطية الموضوع من منظور جديد.

النص المراد تحليله:
` + input;

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: mediaPrompt })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          output.innerText = data.candidates[0].content.parts[0].text;
        } else if (data.error) {
          output.innerText = "حدث خطأ أثناء التحليل: " + (data.error.message || JSON.stringify(data.error));
        } else {
          output.innerText = "لم نتمكن من تلقي إجابة، حاول مجدداً.";
        }
      } catch (err) {
        output.innerText = "فشل الاتصال بالخادم: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
